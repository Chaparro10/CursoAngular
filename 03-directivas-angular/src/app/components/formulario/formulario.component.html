<div class="box">
    <form action="" class="form-row" #f="ngForm" (ngSubmit)="f.form.valid && agregarPersona()">
        <div class="form-group col-md-2">
            <label for="nombre" class="sr-only">
                Nombre
            </label>
            <input type="text" name="nombre" id="nombre" placeholder="Ingresa nombre" class="form-control"
                [(ngModel)]="nombreInput" #nombreRef required />
        </div>

        <div class="form-group col-md-2">
            <label for="apellido" class="sr-only">
                Apellido
            </label>
            <input type="text" name="apellido" id="apellido" placeholder="Ingresa el apellido" class="form-control"
                [(ngModel)]="apellidoInput" #apellidoRef required />
        </div>
        <div class="col mt-2">
            <button *ngIf="!modoEdicion;else Editar" type="submit" class="btn btn-secondary" (click)="agregarPersona()">
                Agregar Persona
            </button>

            <ng-template #Editar>
                <button type="submit" class="btn btn-secondary" (click)="agregarPersona()">
                    Editar Persona
                </button>

                <button type="submit" class="btn btn-secondary" (click)="eliminarPersona()">
                    Eliminar Persona
                </button>

            </ng-template>
        </div>
        <hr />
    </form>
</div>
